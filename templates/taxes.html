{% extends "base.html" %}
{% block title %}Taxes{% endblock %}
{% block content %}
<h1>Taxes</h1>
<div class="card">
  <form method="post" action="/taxes/create" class="formrow">
    <div><label>Name</label><input name="name" required></div>
    <div><label>Rate %</label><input type="number" step="0.01" name="rate" value="0"></div>
    <div><button class="btn" type="submit">Add Tax</button></div>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>ID</th><th>Name</th><th>Rate %</th></tr>
    {% for t in taxes %}
    <tr><td>{{t.id}}</td><td>{{t.name}}</td><td>{{t.rate}}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
